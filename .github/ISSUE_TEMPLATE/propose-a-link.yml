name: Propose a link
description: A project's own documentation states a relationship to another AAIF project.
title: "Link: <project> ↔ <project>"
labels: ["link"]
body:
  - type: input
    id: from
    attributes:
      label: One project
      description: The two ends of the line, in any order. The page draws no arrow.
      placeholder: goose
    validations:
      required: true
  - type: input
    id: to
    attributes:
      label: The other project
      placeholder: MCP
    validations:
      required: true
  - type: textarea
    id: quote
    attributes:
      label: Quote
      description: Copy it as a reader sees it. Use … to join two parts of one passage.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source file URL
      description: The file the quote comes from, in that project's own repository, on its default branch.
      placeholder: https://github.com/owner/repo/blob/main/docs/page.md
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - documented (the docs state the link)
        - example (the docs name the other project as an example only)
    validations:
      required: true
